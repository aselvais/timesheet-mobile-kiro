name: time_tracker
description: A cross-platform mobile time tracking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.3
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.1
  path: ^1.8.3
  uuid: ^4.2.1
  pdf: ^3.10.8
  share_plus: ^7.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.14.1
  build_runner: ^2.4.7
  glados: ^1.1.7
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
